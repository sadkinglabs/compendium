// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Crashlytics gradle plugin: uploads the R8 mapping on release builds so
        // obfuscated stack traces symbolicate in the Crashlytics dashboard.
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.7'
        // Literal, NOT $kotlinVersion - buildscript{} is evaluated before
        // `apply from: variables.gradle` below, so the ext prop isn't defined yet.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10'
        // The Compose compiler, which from Kotlin 2.0 is a separate plugin versioned WITH Kotlin.
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.10'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
