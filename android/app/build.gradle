apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Version + build come from package.json, the single source shared with the web
// layer (vite.config.js bakes the same two values in for the Credits screen). Keep
// them here and the two would drift the first time one was bumped alone.
//   version -> versionName   e.g. "1.0.1-alpha"
//   build   -> versionCode   integer, +1 per APK installed to a device
def appPkg = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json"))

// Release signing config is loaded from android/keystore.properties (gitignored).
// Absent it, release builds simply go unsigned - debug builds are unaffected.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.sadkinglabs.compendium"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sadkinglabs.compendium"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appPkg.build
        versionName appPkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // --- Native card scanner: Compose + Kotlin JVM target (must equal
    //     capacitor.build.gradle's Java 17, else "Inconsistent JVM-target"). ---
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion composeCompilerVersion }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                'META-INF/notice.txt', 'META-INF/*.kotlin_module'
            ]
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            // Ship only ABIs a phone can actually execute. x86/x86_64 exist for
            // emulators, and no device that can install this APK can run them - they
            // were 16.5 MB of an 82.7 MB APK, ~20%, carried since the scanner's first
            // build. The scanner is what makes this expensive: ML Kit's OCR and barcode
            // .so files plus SQLCipher are per-ABI, so every extra ABI is a full copy.
            //
            // RELEASE ONLY, deliberately. Debug keeps all four so the emulator still
            // works on an x86_64 host - putting this in defaultConfig would strip them
            // everywhere and quietly break emulator testing.
            //
            // armeabi-v7a stays: minSdkVersion 22 admits 32-bit devices, and dropping
            // the ABI without raising minSdk would let such a phone install the app and
            // then crash in the scanner rather than being cleanly excluded from the
            // store listing. Those two decisions move together or not at all.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // --- Native card scanner ---
    // Jetpack Compose (BOM-managed)
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:$activityComposeVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleComposeVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleComposeVersion"
    debugImplementation "androidx.compose.ui:ui-tooling"
    // CameraX
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    // ML Kit text recognition + barcode/QR - BUNDLED models, fully offline
    implementation "com.google.mlkit:text-recognition:$mlkitTextVersion"
    implementation "com.google.mlkit:barcode-scanning:$mlkitBarcodeVersion"
    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"

    // --- Firebase (Analytics + Crashlytics) ---
    // Guarded on google-services.json so a clone without it (the file is
    // gitignored) still builds. BoM pins one compatible set of versions.
    if (file('google-services.json').exists()) {
        implementation platform("com.google.firebase:firebase-bom:33.7.0")
        implementation "com.google.firebase:firebase-analytics"
        implementation "com.google.firebase:firebase-crashlytics"
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // Crashlytics needs google-services applied first (reads its config).
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, Firebase plugins not applied.")
}
