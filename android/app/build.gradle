apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Version + build come from package.json, the single source shared with the web
// layer (vite.config.js bakes the same two values in for the Credits screen). Keep
// them here and the two would drift the first time one was bumped alone.
//   version -> versionName   e.g. "1.0.1-alpha"
//   build   -> versionCode   integer, +1 per APK installed to a device
def appPkg = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json"))

// Release signing config is loaded from android/keystore.properties (gitignored).
// Absent it, release builds simply go unsigned - debug builds are unaffected.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.sadkinglabs.compendium"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sadkinglabs.compendium"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appPkg.build
        versionName appPkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // --- Native card scanner: Compose + Kotlin JVM target (must equal
    //     capacitor.build.gradle's Java 17, else "Inconsistent JVM-target"). ---
    buildFeatures { compose true }
    // No composeOptions block: the Compose compiler plugin applied above owns that now, and
    // declaring kotlinCompilerExtensionVersion alongside it is an error rather than a duplicate.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                'META-INF/notice.txt', 'META-INF/*.kotlin_module'
            ]
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            // Ship only ABIs a phone can actually execute. x86/x86_64 exist for
            // emulators, and no device that can install this APK can run them - they
            // were 16.5 MB of an 82.7 MB APK, ~20%, carried since the scanner's first
            // build. The scanner is what makes this expensive: ML Kit's OCR and barcode
            // .so files plus SQLCipher are per-ABI, so every extra ABI is a full copy.
            //
            // RELEASE ONLY, deliberately. Debug keeps all four so the emulator still
            // works on an x86_64 host - putting this in defaultConfig would strip them
            // everywhere and quietly break emulator testing.
            //
            // armeabi-v7a is now dropped too. To be precise about which lever does what: THIS FILTER
            // is what excludes 32-bit-only devices - a build without their ABI is not offered to them -
            // and minSdkVersion 29 is a separate decision that merely made the loss acceptable, since
            // a 32-bit-only phone new enough for Android 10 is vanishingly rare. Together they mean
            // such a device is cleanly excluded by the store listing rather than installing and then
            // crashing in the scanner. arm64-only also halves the per-ABI native payload (ML Kit OCR +
            // barcode, SQLCipher, ONNX Runtime are all per-ABI copies).
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }
}

// Kotlin's JVM target MUST equal the Java target above or the build fails with
// "Inconsistent JVM-target compatibility". `kotlinOptions` is deprecated in Kotlin 2.x, so this is
// the compilerOptions DSL. It moves to 21 with the rest of the toolchain.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// ===================== RECOGNITION ASSET GATE =====================
// The card recogniser's model + prototype index are GENERATED artifacts (~27 MB), too large to track in
// git, so they are gitignored. Without this gate a clean checkout would build and install happily and
// then fail every scan with "Visual match unavailable" - a green build that does not deliver the feature.
// Regenerate them with:
//   scripts/recog/train/.venv/Scripts/python build_artifact.py && python build_index.py
//   (then copy _out/{dinov2_s448_int8.onnx,index.f16,index.json} to android/app/src/main/assets/recog/)
// index.json carries the dim/count/sha256 the loader checks the index against at runtime.
def recogAssets = ['dinov2_s448_int8.onnx', 'index.f16', 'index.json']
tasks.register('checkRecogAssets') {
    doLast {
        def dir = file('src/main/assets/recog')
        def missing = recogAssets.findAll { !new File(dir, it).exists() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Card recogniser assets missing from ${dir}: ${missing.join(', ')}.\n" +
                "The app would build but every scan would report 'Visual match unavailable'.\n" +
                "Regenerate with scripts/recog/train/build_artifact.py + build_index.py (see BUILD.md)."
            )
        }
    }
}
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach { dependsOn 'checkRecogAssets' }

// 16 KB page-size compatibility - KNOWN REMAINING GAP: libsqlcipher.so (4 KB-aligned LOAD segments).
// It comes from @capacitor-community/sqlite 6.0.2, which pins the legacy, unmaintained artifact
// net.zetetic:android-database-sqlcipher:4.5.3. The aligned successor (net.zetetic:sqlcipher-android)
// is NOT a drop-in: it moved the package namespace, so substituting it crashes the plugin at startup
// with NoClassDefFoundError net/sqlcipher/database/SQLiteDatabase (verified on device, 2026-08-08).
// Closing this gap needs the plugin itself to adopt the new artifact - i.e. a Capacitor 7 upgrade -
// which is its own change. Every other native library in the APK is 16 KB compatible.

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // Card recogniser visual-match fallback (Rev 5.1): ONNX Runtime for on-device DINOv2-small int8
    // inference, run ONCE per user-tapped "Try visual match" (never per frame). Offline, bundled.
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.22.0"
    implementation project(':capacitor-cordova-android-plugins')

    // --- Native card scanner ---
    // Jetpack Compose (BOM-managed)
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.material3:material3"
    // Declared EXPLICITLY, because it used to arrive by accident. material3 1.2.1 depended on
    // material-icons transitively; 1.4.0 dropped that, so `Icons.Filled.*` stopped resolving the
    // moment the Compose BOM moved. It was always a real dependency of the scanner UI - six icons
    // across RecognitionSheet and ScannerScreen - and was simply never written down.
    // The BOM pins it at 1.7.8: Google has frozen this library. Six inline vector paths would remove
    // it entirely (the web layer already has its own icon set in components/icons.jsx), but that is
    // feature work, not an upgrade, so it is recorded as a follow-up rather than done here.
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.activity:activity-compose:$activityComposeVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleComposeVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleComposeVersion"
    debugImplementation "androidx.compose.ui:ui-tooling"
    // CameraX
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    // ML Kit text recognition + barcode/QR - BUNDLED models, fully offline
    implementation "com.google.mlkit:text-recognition:$mlkitTextVersion"
    implementation "com.google.mlkit:barcode-scanning:$mlkitBarcodeVersion"
    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"

    // --- Firebase (Analytics + Crashlytics) ---
    // UNCONDITIONAL, unlike the google-services plugin below. telemetry/TelemetryPlugin.kt
    // imports these classes, so guarding them on google-services.json would stop a clone
    // without that (gitignored) file from COMPILING - the opposite of the guard's intent.
    // A clone still builds and runs: the classes are present, the plugin below is not
    // applied, so there is no google_app_id, so FirebaseApp never initialises and every
    // getInstance() in TelemetryPlugin throws into its own catch. That degrades to "no
    // telemetry", which is the correct posture for a config-less clone anyway.
    // BoM pins one compatible set of versions.
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-crashlytics"
}

// ===================== FORBIDDEN PERMISSION GATE =====================
// Fails assembleRelease if an advertising/attribution permission survives into the
// release variant's MERGED MANIFEST. Not a lint, not a warning - the build goes red.
//
// SCOPE, STATED HONESTLY: this reads AGP's MERGED_MANIFEST artifact, which is the input
// to packaging, not the packaged APK itself. That covers the actual risk here - these
// permissions arrive via manifest MERGING from play-services-measurement* - but it is
// not the same claim as "inspects the final artifact", and an earlier version of this
// comment said exactly that. Anything that could add a permission AFTER the merge would
// not be caught. Verify the shipped APK independently before a Play release:
//   aapt2 dump badging <apk> | grep uses-permission
//
// WHY THIS EXISTS: build 37 shipped `AD_ID` for 37 builds and nobody noticed, because
// the source manifest declares 3 permissions and the merged one declares 12. The
// tools:node="remove" entries that strip them must survive every Firebase BoM bump,
// and "remember to check the merged manifest after upgrading" is not a control - this
// whole change exists because nobody read it. So the machine reads it.
//
// The path comes from AGP's artifact API, never a hardcoded intermediates/ path: an
// AGP upgrade that moves the file must break the build LOUDLY. A gate that cannot find
// its input and passes is worse than no gate, so every ambiguity below fails closed.
// Permissions the app does not use and must not declare. Every one of these is merged
// in by a transitive dependency, which is why the list needs a machine watching it: none
// of them appear in AndroidManifest.xml, so reading the source tells you nothing.
def FORBIDDEN_PERMISSIONS = [
    // Advertising / attribution, via play-services-measurement* (= firebase-analytics).
    'com.google.android.gms.permission.AD_ID',
    'android.permission.ACCESS_ADSERVICES_AD_ID',
    'android.permission.ACCESS_ADSERVICES_ATTRIBUTION',
    'com.google.android.finsky.permission.BIND_GET_INSTALL_REFERRER_SERVICE',
    // Biometrics, via androidx.biometric (@capacitor-community/sqlite pulls it in for
    // biometric unlock of an encrypted DB). Compendium never encrypts, so the plugin's
    // biometric branch is unreachable - see the manifest for the full argument.
    // USE_FINGERPRINT is also deprecated (API 28 -> USE_BIOMETRIC).
    'android.permission.USE_BIOMETRIC',
    'android.permission.USE_FINGERPRINT',
]

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        def checkTask = tasks.register("check${variant.name.capitalize()}ForbiddenPermissions") {
            // .INSTANCE: SingleArtifact.MERGED_MANIFEST is a Kotlin object, and Groovy
            // needs the instance, not the class.
            def manifestFile = variant.artifacts.get(com.android.build.api.artifact.SingleArtifact.MERGED_MANIFEST.INSTANCE)
            inputs.file(manifestFile)
            doLast {
                def f = manifestFile.get().asFile
                // Fail closed: absent or unreadable input is a FAILURE, never a pass.
                if (!f.exists()) {
                    throw new GradleException("Forbidden-permission gate: merged manifest not found at ${f}. Refusing to pass a check that could not run.")
                }
                def xml
                try {
                    xml = new XmlSlurper().parse(f)
                } catch (Exception e) {
                    throw new GradleException("Forbidden-permission gate: could not parse ${f} (${e.message}). Refusing to pass a check that could not run.")
                }
                def declared = xml.'uses-permission'.collect { it.@'android:name'.text() }
                if (declared.isEmpty()) {
                    throw new GradleException("Forbidden-permission gate: parsed ${f} but found no <uses-permission> at all. The app declares INTERNET/CAMERA/VIBRATE, so this means the parser is looking at the wrong thing.")
                }
                def found = FORBIDDEN_PERMISSIONS.findAll { declared.contains(it) }
                if (found) {
                    throw new GradleException(
                        "Forbidden permission(s) in the release merged manifest:\n" +
                        found.collect { "  - ${it}" }.join('\n') +
                        "\n\nThese are merged in by play-services-measurement* (= firebase-analytics).\n" +
                        "Restore the matching tools:node=\"remove\" entry in AndroidManifest.xml.\n" +
                        "See docs/proposals/telemetry-consent.md."
                    )
                }
                logger.lifecycle("Forbidden-permission gate: clean (${declared.size()} permissions in the release merged manifest).")
            }
        }
        // Bind to the artifact's producing task so assembleRelease cannot succeed
        // without it, and so `gradlew checkReleaseForbiddenPermissions` also works alone.
        tasks.matching { it.name == "assemble${variant.name.capitalize()}" }.configureEach {
            it.dependsOn(checkTask)
        }
    }
}
// =====================================================================

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // Crashlytics needs google-services applied first (reads its config).
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, Firebase plugins not applied.")
}
